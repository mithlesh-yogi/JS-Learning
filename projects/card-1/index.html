<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="body">
    <div class="card">
        <div class="card-img">
            <img src="imges/img-4.png" alt="" class="img">
        </div>
        <div class="content">
            <div class="about-box">
                <h3 class="name">Sophie Bennett <span class="span"><i class="bi bi-patch-check-fill"></i></span></h3>
                <p class="intro">A Software Engineer Focused on real-world project </p>
            </div>
            <div class="score">
                <i class="fa-regular fa-eye" id="i"> <p>5 k</p></i>
                <i class="fa-solid fa-thumbs-up" id="i"> <p>1 . 2 k</p></i>
                <button class="button">Follow <span><i class="fa-solid fa-plus"></i></span></button>
            </div>
        </div> 
    </div>
</body>
</html>
