<script>

        function child1(){
            let name2 = "mith"

        }
        child1()
        // console.log(name2);  
        function child2(){
            console.log(name1);
            // console.log(name2);

    }
    parent()

    // closure
    function makefun(){
        const name ="mozila"

function clickhandler(color){

    return function(){
        document.body.style.backgroundColor = `${color}`
    }
    
}

document.querySelector('#orange').onclick = clickhandler("orange")
document.querySelector('#green').onclick = clickhandler("green")
